description: >-
  Peach Payments uses custom, volume-based merchant pricing rather than
  published API tiers. Standard accounts are commonly quoted around 2.95% +
  R1.50 per successful card transaction, while Enterprise accounts pay a fixed
  monthly fee (commonly cited around R500/month) for negotiated volume-based
  rates, daily settlements, and PayPal access. International cards carry an
  additional currency-conversion fee (commonly 2.5-3.5%), and disputes/
  chargebacks are billed per event (commonly R350). API access itself is not
  separately metered; you pay per processed transaction. Exact rates are
  negotiated with the sales team.
notes: >-
  Figures are representative rates cited by third-party comparisons and the
  Peach Payments fees page; Peach does not publish a fixed public rate card.
  Verify current rates directly with Peach Payments sales. Currency is South
  African Rand (ZAR); Peach also processes KES (Kenya) and MUR (Mauritius).
